[package]
name = "polymarket-5m-bot"
version = "0.3.0"
edition = "2021"
description = "Contrarian trading bot for Polymarket BTC 5-minute markets"
license = "MIT"
default-run = "polybot"

[[bin]]
name = "polybot"
path = "src/main.rs"

[[bin]]
name = "polybot-tools"
path = "src/cli.rs"

[lib]
name = "polymarket_5m_bot"
path = "src/lib.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "registry"] }
tracing-appender = "0.2"
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1"
uuid = { version = "1", features = ["v4", "serde"] }
futures-util = "0.3"
rust_decimal = { version = "1", features = ["maths", "serde", "serde-with-float"] }
polymarket-client-sdk = { version = "0.4", features = ["clob", "ctf"] }
alloy = { version = "1.6", default-features = false, features = ["signer-local", "signers", "contract", "providers", "provider-http", "transports", "transport-http"] }
dotenvy = "0.15"
secrecy = "0.10"
rustls = { version = "0.23", features = ["ring"] }
ratatui = "0.30"
crossterm = "0.29"

[dev-dependencies]
tempfile = "3"

# Temporary upstream compatibility patches:
# - alloy-primitives and syn-solidity use maintained `pastey` instead of `paste`.
# - ruint drops unused legacy ark-ff 0.3/0.4/0.5 integrations that pull
#   unmaintained transitive macros.
[patch.crates-io]
alloy-primitives = { path = "vendor/alloy-primitives" }
ruint = { path = "vendor/ruint" }
syn-solidity = { path = "vendor/syn-solidity" }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 16
strip = true

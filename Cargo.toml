[package]
name = "binance-5m-bot"
version = "0.3.0"
edition = "2021"
description = "Binance Prediction BTC five-minute value-momentum trading bot"
license = "MIT"
default-run = "binance-5m-bot"

[[bin]]
name = "binance-5m-bot"
path = "src/main.rs"

[[bin]]
name = "binance-5m-tools"
path = "src/cli.rs"

[lib]
name = "binance_5m_bot"
path = "src/lib.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
url = "2"
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "registry"] }
tracing-appender = "0.2"
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1"
uuid = { version = "1", features = ["v4", "serde"] }
futures-util = "0.3"
rust_decimal = { version = "1", features = ["maths", "serde", "serde-with-float"] }
binance-sdk = { version = "61.0.0", default-features = false, features = ["rustls-tls", "w3w_prediction"] }
dotenvy = "0.15"
secrecy = "0.10"
rustls = { version = "0.23", features = ["ring"] }
ratatui = "0.30"
crossterm = "0.29"

[dev-dependencies]
tempfile = "3"


[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 16
strip = true

# Binance Prediction BTC 5-minute Bot Configuration
# API credentials belong in .env, never in this file.

[trading]
mode = "paper"                       # "paper" or "live"
paper_starting_balance = 100.0        # USDT
allow_uncalibrated_model_live = false # explicit acknowledgement required for live

[binance_prediction]
# Leave wallet fields unset when exactly one Prediction Wallet is registered.
# Set both fields when the account has multiple wallets.
# wallet_id = ""
# wallet_address = ""
payment_account = "spot"             # "spot" or "funding"
funding_source = "cex"                # "cex" or "mpc"
api_timeout_ms = 10000
market_duration_ms = 300000            # BTC Prediction five-minute window
market_discovery_limit = 50
quote_slippage_bps = 25                # Market/FOK quote tolerance: 0.25%
order_reconciliation_attempts = 5
order_reconciliation_delay_ms = 1000

[strategy]
position_size_usdt = 2.0               # Binance MARKET/FOK minimum is about 1.5 USDT
min_entry_ttl_ms = 75000               # no entry in final 75 seconds
max_entry_ttl_ms = 150000              # observe first half of each window
min_normalized_move = 0.60
min_net_edge = 0.05
model_uncertainty = 0.03
fee_buffer = 0.02
max_spread = 0.03
min_depth_multiple = 5.0
volatility_lookback_secs = 900
min_volatility_samples = 120
order_book_stale_threshold_ms = 8000
max_unsettled_positions = 2
# Catastrophe-only guard, NOT a tight risk control: it halts entries only after a
# full window of settled trades whose win rate falls below the floor. The daily
# loss limit, loss-streak cooldown, and daily trade cap in [risk] are the primary
# controls. Raise circuit_breaker_min_win_rate to make it bite sooner.
circuit_breaker_window = 50
circuit_breaker_min_win_rate = 0.05

[risk]
daily_loss_limit_usdt = 5.0
max_consecutive_losses = 3
loss_cooldown_ms = 1800000             # 30 minutes
max_trades_per_day = 8

[polling]
signal_interval_ms = 1000
status_interval_ms = 10000
market_refresh_secs = 15
settlement_check_secs = 15

[price_source]
symbol = "BTCUSDT"
stale_threshold_ms = 3000
buffer_max = 2000
buffer_min_ticks = 120

[misc]
trade_log_flush_secs = 30
shutdown_timeout_secs = 10
